name: Build and Deploy Frontend

on:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: ./frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Project
        env:
          CI: false # This tells the bundler to treat ESLint warnings as warnings, not fatal errors
        run: npm run build
