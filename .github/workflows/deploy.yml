name: Build and Deploy Frontend

on:
  push:
    branches:
      - main

# 1. Add this defaults block right here
defaults:
  run:
    working-directory: ./frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2. Because of the default setting above, these will now run inside /frontend automatically!
      - name: Install dependencies
        run: npm install

      - name: Build Project
        run: npm run build
